<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Convertitore voti</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una colonna stretta; scelta delle scale, convertitore a due campi, tabella di riferimento */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --fg: #1b2233;
  --muted: #5d6680;
  --line: #d9deea;
  --accent: #2f4bb0;
  --accent-soft: #e6ebfa;
  --on-accent: #ffffff;
  --err: #b8322a;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11151f; --surface: #1a2030; --fg: #e8ecf5; --muted: #98a1ba;
    --line: #2c3448; --accent: #8fa6ff; --accent-soft: #232c48; --on-accent: #11151f;
    --err: #ff8a80; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding: max(32px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
}
main { max-width: 580px; margin: 0 auto; display: grid; gap: 28px; }
h1 {
  font-family: var(--display); font-weight: 700; font-size: clamp(1.8rem, 6vw, 2.4rem);
  line-height: 1.1; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em;
}
.lead { margin: 0; color: var(--muted); }
.label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }

/* Scale */
.scales { display: grid; gap: 16px; }
.scale-row { display: grid; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  font: 500 0.95rem var(--mono); padding: 6px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.custom {
  width: 7.5em; font: 500 0.95rem var(--mono); padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
.custom.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

/* Convertitore */
.converter {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 24px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: end;
}
.field { display: grid; gap: 6px; min-width: 0; }
.input-wrap { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--line); }
.input-wrap:focus-within { border-color: var(--accent); }
.big {
  width: 100%; min-width: 0; border: 0; background: transparent; color: var(--fg);
  font-family: var(--display); font-weight: 700; font-size: 3rem; line-height: 1.1;
  padding: 0 0 4px; font-variant-numeric: tabular-nums; outline: none;
}
.den { font-family: var(--mono); color: var(--muted); font-size: 1.1rem; white-space: nowrap; }
.arrow { font-family: var(--mono); color: var(--accent); font-size: 1.5rem; padding-bottom: 14px; }
.note { grid-column: 1 / -1; margin: 0; font-size: 0.9rem; color: var(--muted); min-height: 1.4em; }
.note strong { color: var(--fg); font-weight: 500; }
.note.err { color: var(--err); }

/* Tabella */
h2 { font-family: var(--display); font-weight: 500; font-size: 1.15rem; margin: 0 0 10px; }
.formula { font-family: var(--mono); font-size: 0.9rem; color: var(--muted); margin: 0 0 14px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 7px 12px; border-bottom: 1px solid var(--line); }
th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
th:first-child, td:first-child { text-align: left; }
td { font-family: var(--mono); }
tr.half td { color: var(--muted); }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--accent-soft); }
tr.hit td { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

@media (max-width: 480px) {
  .converter { grid-template-columns: 1fr; }
  .arrow { padding: 0; transform: rotate(90deg); justify-self: start; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Convertitore voti</h1>
    <p class="lead">Scegli le scale, poi scrivi il voto in uno dei due campi: l'altro si aggiorna da solo.</p>
  </header>

  <section class="scales" aria-label="Scale di voto">
    <div class="scale-row">
      <span class="label" id="lbl-from">Voto di partenza su</span>
      <div class="chips" role="group" aria-labelledby="lbl-from" id="from-chips"></div>
    </div>
    <div class="scale-row">
      <span class="label" id="lbl-to">Converti in voto su</span>
      <div class="chips" role="group" aria-labelledby="lbl-to" id="to-chips"></div>
    </div>
  </section>

  <section class="converter" aria-label="Convertitore">
    <div class="field">
      <label class="label" for="va" id="lbl-a">Voto su 11</label>
      <div class="input-wrap">
        <input class="big" id="va" type="text" inputmode="decimal" autocomplete="off" value="8,5">
        <span class="den" id="den-a">/ 11</span>
      </div>
    </div>
    <div class="arrow" aria-hidden="true">⇄</div>
    <div class="field">
      <label class="label" for="vb" id="lbl-b">Voto su 100</label>
      <div class="input-wrap">
        <input class="big" id="vb" type="text" inputmode="decimal" autocomplete="off">
        <span class="den" id="den-b">/ 100</span>
      </div>
    </div>
    <p class="note" id="note" aria-live="polite"></p>
  </section>

  <section>
    <h2>Tabella di conversione</h2>
    <p class="formula" id="formula"></p>
    <div class="table-wrap">
      <table>
        <thead><tr><th id="th-a">Su 11</th><th id="th-b">Su 100</th><th>Arrotondato</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const FROM_PRESETS = [10, 11, 20, 30];
const TO_PRESETS = [100, 10, 20, 30, 60, 110];
const state = { from: 11, to: 100 };

const $ = id => document.getElementById(id);
const va = $('va'), vb = $('vb'), note = $('note'), tbody = $('tbody');
const fmt = (n, d = 2) => n.toLocaleString('it-IT', { minimumFractionDigits: 0, maximumFractionDigits: d });
const parse = s => { const t = String(s).trim().replace(',', '.'); return t === '' ? NaN : Number(t); };
const round2 = n => Math.round(n * 100) / 100;

try {
  const saved = JSON.parse(localStorage.getItem('convertitore-voti') || 'null');
  if (saved && saved.from > 0 && saved.to > 0) { state.from = saved.from; state.to = saved.to; }
} catch (e) {}
function save() { try { localStorage.setItem('convertitore-voti', JSON.stringify(state)); } catch (e) {} }

function buildChips(container, presets, key) {
  container.innerHTML = '';
  presets.forEach(v => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = v; b.dataset.v = v;
    b.addEventListener('click', () => setScale(key, v));
    container.appendChild(b);
  });
  const inp = document.createElement('input');
  inp.type = 'text'; inp.inputMode = 'decimal'; inp.className = 'custom';
  inp.id = 'custom-' + key; inp.placeholder = 'Altro…';
  inp.setAttribute('aria-label', 'Punteggio massimo personalizzato');
  inp.addEventListener('input', () => {
    const v = parse(inp.value);
    if (v > 0) setScale(key, v, true);
  });
  container.appendChild(inp);
}

function syncChips(container, presets, key) {
  const v = state[key];
  const isPreset = presets.includes(v);
  container.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.v) === v)));
  const inp = container.querySelector('.custom');
  inp.classList.toggle('active', !isPreset);
  if (!isPreset && document.activeElement !== inp) inp.value = fmt(v);
  if (isPreset && document.activeElement !== inp) inp.value = '';
}

function setScale(key, v, fromCustom) {
  state[key] = v;
  if (!fromCustom) { const c = $('custom-' + key); c.value = ''; }
  save();
  render();
}

function render() {
  const { from, to } = state;
  syncChips($('from-chips'), FROM_PRESETS, 'from');
  syncChips($('to-chips'), TO_PRESETS, 'to');
  $('lbl-a').textContent = 'Voto su ' + fmt(from);
  $('lbl-b').textContent = 'Voto su ' + fmt(to);
  $('den-a').textContent = '/ ' + fmt(from);
  $('den-b').textContent = '/ ' + fmt(to);
  $('th-a').textContent = 'Su ' + fmt(from);
  $('th-b').textContent = 'Su ' + fmt(to);
  $('formula').textContent = `voto su ${fmt(to)} = voto su ${fmt(from)} × ${fmt(to)} ÷ ${fmt(from)}`;
  buildTable();
  fromA();
}

function buildTable() {
  const { from, to } = state;
  tbody.innerHTML = '';
  // passo: mezzo punto per scale piccole, 1 punto fino a 30, poi intervalli più larghi
  const step = from <= 12 ? 0.5 : from <= 30 ? 1 : Math.max(1, Math.round(from / 20));
  const vals = [];
  for (let g = 0; g < from - 1e-9; g += step) vals.push(round2(g));
  vals.push(from);
  vals.forEach(g => {
    const p = g * to / from;
    const tr = document.createElement('tr');
    if (!Number.isInteger(g)) tr.className = 'half';
    tr.dataset.g = g;
    tr.innerHTML = `<td>${fmt(g)}</td><td>${fmt(p)}</td><td>${fmt(Math.round(p), 0)}</td>`;
    tr.addEventListener('click', () => { va.value = fmt(g); fromA(); });
    tbody.appendChild(tr);
  });
}

function highlight(g) {
  tbody.querySelectorAll('tr').forEach(tr => tr.classList.toggle('hit', Number(tr.dataset.g) === g));
}
function showError(msg) { note.textContent = msg; note.className = 'note err'; highlight(-1); }
function clearNote() { note.textContent = ''; note.className = 'note'; highlight(-1); }

function fromA() {
  const { from, to } = state;
  const g = parse(va.value);
  if (isNaN(g)) { vb.value = ''; return clearNote(); }
  if (g < 0 || g > from) { vb.value = ''; return showError(`Il voto deve stare tra 0 e ${fmt(from)}.`); }
  const p = g * to / from;
  vb.value = fmt(p);
  note.className = 'note';
  note.innerHTML = `${fmt(g)}/${fmt(from)} = <strong>${fmt(p)}/${fmt(to)}</strong> · arrotondato: <strong>${fmt(Math.round(p), 0)}</strong>`;
  highlight(round2(g));
}

function fromB() {
  const { from, to } = state;
  const p = parse(vb.value);
  if (isNaN(p)) { va.value = ''; return clearNote(); }
  if (p < 0 || p > to) { va.value = ''; return showError(`Il voto deve stare tra 0 e ${fmt(to)}.`); }
  const g = p * from / to;
  va.value = fmt(g);
  note.className = 'note';
  note.innerHTML = `${fmt(p)}/${fmt(to)} = <strong>${fmt(g)}/${fmt(from)}</strong>`;
  highlight(round2(g));
}

va.addEventListener('input', fromA);
vb.addEventListener('input', fromB);
buildChips($('from-chips'), FROM_PRESETS, 'from');
buildChips($('to-chips'), TO_PRESETS, 'to');
render();
</script>
</body>
</html>
